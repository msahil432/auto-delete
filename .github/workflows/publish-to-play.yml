name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_publishing:
        description: 'Skip publishing (dry run: skips Google Play, GitHub Release, and artifact upload)'
        required: false
        default: false
        type: boolean
      track:
        description: 'Play Store track (if publishing to Play Store)'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      custom_version_name:
        description: 'Custom Version Name (leave blank to auto-detect from tag/git)'
        required: false
        type: string
      custom_version_code:
        description: 'Custom Version Code (leave blank to use workflow run number)'
        required: false
        type: string
      bust_cache:
        description: 'Bust cache (force fresh build without cache)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed for git tag resolution

      # ── 2. Resolve version info ────────────────────────────────────────────
      - name: Resolve versionName and versionCode
        id: version
        run: |
          CUSTOM_VERSION="${{ inputs.custom_version_name }}"
          # If a custom version is specified in manual dispatch, use it
          if [[ -n "$CUSTOM_VERSION" ]]; then
            VERSION_NAME="${CUSTOM_VERSION#v}"
          # If triggered by a tag (e.g. v1.0.0), strip leading 'v'
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          # Otherwise fallback to git describe or 0.0.1
          else
            VERSION_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
            VERSION_NAME="${VERSION_NAME#v}"
          fi

          CUSTOM_VERSION_CODE="${{ inputs.custom_version_code }}"
          if [[ -n "$CUSTOM_VERSION_CODE" ]]; then
            VERSION_CODE="$CUSTOM_VERSION_CODE"
          else
            # versionCode = GitHub Actions run number (always increasing workflow run count)
            VERSION_CODE=${{ github.run_number }}
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "versionName=$VERSION_NAME  versionCode=$VERSION_CODE"

      # ── 3. Java / JDK ──────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ── 3b. Setup Gradle & Caching ─────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ inputs.bust_cache == true }}
          cache-read-only: false  # Allows writing cache on workflow runs
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # ── 4. Decode keystore ─────────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Validate required secrets
          MISSING=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING KEYSTORE_BASE64"
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING KEY_ALIAS"
          [ -z "$STORE_PASSWORD" ] && MISSING="$MISSING STORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ] && MISSING="$MISSING KEY_PASSWORD"

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required signing secrets in GitHub repository:$MISSING"
            echo "Please configure them in Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          # Strip any certutil/PEM headers, newlines, and whitespace before decoding
          CLEAN_BASE64=$(echo "$KEYSTORE_BASE64" | sed -e 's/-----BEGIN.*-----//g' -e 's/-----END.*-----//g' | tr -d '\r\n[:space:]')
          echo "$CLEAN_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"

          # Verify non-empty file
          if [ ! -s "${{ github.workspace }}/release.jks" ]; then
            echo "::error::Decoded release.jks is empty. Check your KEYSTORE_BASE64 secret format."
            exit 1
          fi
          echo "Keystore decoded successfully ($(wc -c < "${{ github.workspace }}/release.jks") bytes)."

      # ── 5. Build signed release APK and AAB ────────────────────────────────
      # Env var names and project properties read by build.gradle.kts:
      #   KEYSTORE_PATH, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS, VERSION_NAME, VERSION_CODE
      - name: Build release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          BUST_CACHE: ${{ inputs.bust_cache }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ "$BUST_CACHE" = "true" ]; then
            echo "Cache busting enabled: running clean and disabling build cache"
            ./gradlew clean --no-build-cache --rerun-tasks --refresh-dependencies
          fi

          ./gradlew assembleRelease bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      # ── 6. Clean up keystore from runner ───────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.jks

      # ── 7. Upload APK artifact (Actions run download) ──────────────────────
      - name: Upload APK artifact
        if: inputs.skip_publishing != true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-apk-v${{ steps.version.outputs.VERSION_NAME }}-${{ steps.version.outputs.VERSION_CODE }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── 8. Upload AAB artifact (Actions run download) ──────────────────────
      - name: Upload AAB artifact
        if: inputs.skip_publishing != true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-aab-v${{ steps.version.outputs.VERSION_NAME }}-${{ steps.version.outputs.VERSION_CODE }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ── 8b. Upload R8 Deobfuscation Mapping (for crash analysis) ───────────
      - name: Upload R8 Mapping Artifact
        if: inputs.skip_publishing != true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: r8-mapping-v${{ steps.version.outputs.VERSION_NAME }}-${{ steps.version.outputs.VERSION_CODE }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      # ── 9. Publish to GitHub Releases (Direct download from GitHub) ────────
      - name: Create or Update GitHub Release
        if: inputs.skip_publishing != true && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
          name: "Release v${{ steps.version.outputs.VERSION_NAME }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      # ── 10. Publish to Google Play ─────────────────────────────────────────
      - name: Publish to Google Play
        if: inputs.skip_publishing != true
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.APP_PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: ${{ inputs.track || 'internal' }}
          status: completed