name: CI & Build Validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.env.example'
      - 'metadata.json'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.env.example'
      - 'metadata.json'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── 2. Java / JDK ──────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ── 3. Setup Gradle & Caching ──────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # ── 4. Lint and Unit Tests ─────────────────────────────────────────────
      - name: Run Lint and Unit Tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest lintDebug

      # ── 5. Assemble Debug APK ──────────────────────────────────────────────
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      # ── 6. Upload Lint Reports ─────────────────────────────────────────────
      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
            app/build/reports/lint-results-debug.xml
          retention-days: 1
          if-no-files-found: ignore

      # ── 7. Upload Unit Test Reports ────────────────────────────────────────
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 1
          if-no-files-found: ignore

