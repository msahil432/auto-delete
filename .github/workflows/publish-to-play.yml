name: Build & Publish to Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track to publish to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      custom_version_name:
        description: 'Custom Version Name (leave blank to auto-detect from tag/git)'
        required: false
        type: string

concurrency:
  group: play-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build Release AAB & Publish to Play Store
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git tag resolution

      # ── 2. Resolve version info ────────────────────────────────────────────
      - name: Resolve versionName and versionCode
        id: version
        run: |
          CUSTOM_VERSION="${{ inputs.custom_version_name }}"
          # If a custom version is specified in manual dispatch, use it
          if [[ -n "$CUSTOM_VERSION" ]]; then
            VERSION_NAME="${CUSTOM_VERSION#v}"
          # If triggered by a tag (e.g. v1.0.0), strip leading 'v'
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          # Otherwise fallback to git describe or 0.0.1
          else
            VERSION_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
            VERSION_NAME="${VERSION_NAME#v}"
          fi
          # versionCode = GitHub Actions run number (always increasing)
          VERSION_CODE=${{ github.run_number }}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "versionName=$VERSION_NAME  versionCode=$VERSION_CODE"

      # ── 3. Java / JDK ──────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ── 4. Decode keystore ─────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.jks

      # ── 5. Build release AAB ───────────────────────────────────────────────
      # Env var names must match exactly what build.gradle.kts reads via System.getenv():
      #   KEYSTORE_PATH, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.version.name="$VERSION_NAME" \
            -Pandroid.injected.version.code="$VERSION_CODE"

      # ── 6. Clean up keystore from runner ───────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.jks

      # ── 7. Upload AAB artifact (optional but useful for debugging) ──────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-aab-${{ steps.version.outputs.VERSION_NAME }}-${{ steps.version.outputs.VERSION_CODE }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7

      # ── 8. Publish to Google Play ──────────────────────────────────────────
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.APP_PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed