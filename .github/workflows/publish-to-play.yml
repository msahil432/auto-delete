name: Build & Release (APK / AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: 'Publish to Google Play Store'
        required: true
        default: true
        type: boolean
      track:
        description: 'Play Store track (if publishing to Play Store)'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      custom_version_name:
        description: 'Custom Version Name (leave blank to auto-detect from tag/git)'
        required: false
        type: string
      custom_version_code:
        description: 'Custom Version Code (leave blank to use workflow run number)'
        required: false
        type: string
      bust_cache:
        description: 'Bust cache (force fresh build without cache)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git tag resolution

      # ── 2. Resolve version info ────────────────────────────────────────────
      - name: Resolve versionName and versionCode
        id: version
        run: |
          CUSTOM_VERSION="${{ inputs.custom_version_name }}"
          # If a custom version is specified in manual dispatch, use it
          if [[ -n "$CUSTOM_VERSION" ]]; then
            VERSION_NAME="${CUSTOM_VERSION#v}"
          # If triggered by a tag (e.g. v1.0.0), strip leading 'v'
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          # Otherwise fallback to git describe or 0.0.1
          else
            VERSION_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
            VERSION_NAME="${VERSION_NAME#v}"
          fi

          CUSTOM_VERSION_CODE="${{ inputs.custom_version_code }}"
          if [[ -n "$CUSTOM_VERSION_CODE" ]]; then
            VERSION_CODE="$CUSTOM_VERSION_CODE"
          else
            # versionCode = GitHub Actions run number (always increasing workflow run count)
            VERSION_CODE=${{ github.run_number }}
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "versionName=$VERSION_NAME  versionCode=$VERSION_CODE"

      # ── 3. Java / JDK ──────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3b. Setup Gradle & Caching ─────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.bust_cache == true }}

      # ── 4. Decode keystore ─────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.jks

      # ── 5. Build signed release APK and AAB ────────────────────────────────
      # Env var names and project properties read by build.gradle.kts:
      #   KEYSTORE_PATH, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS, VERSION_NAME, VERSION_CODE
      - name: Build release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          BUST_CACHE: ${{ inputs.bust_cache }}
        run: |
          if [ "$BUST_CACHE" = "true" ]; then
            echo "Cache busting enabled: running clean and disabling build cache"
            ./gradlew clean --no-build-cache --rerun-tasks --refresh-dependencies
          fi

          ./gradlew assembleRelease bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      # ── 6. Clean up keystore from runner ───────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.jks

      # ── 7. Upload APK artifact (Actions run download) ──────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-apk-v${{ steps.version.outputs.VERSION_NAME }}-${{ steps.version.outputs.VERSION_CODE }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── 8. Upload AAB artifact (Actions run download) ──────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-aab-v${{ steps.version.outputs.VERSION_NAME }}-${{ steps.version.outputs.VERSION_CODE }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # ── 9. Publish to GitHub Releases (Direct download from GitHub) ────────
      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
          name: "Release v${{ steps.version.outputs.VERSION_NAME }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      # ── 10. Publish to Google Play (Optional / conditional) ────────────────
      - name: Publish to Google Play
        if: ${{ inputs.publish_to_play }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.APP_PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed